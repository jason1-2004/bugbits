<!DOCTYPE html>
<html lang=en><head><meta charset=UTF-8><title>BugBits Web</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;overflow:hidden;font-family:Arial,sans-serif;color:#fff}
#gc{position:relative;width:100vw;height:100vh}
#cvs{display:block;width:100%;height:100%}
.pnl{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460);z-index:100;overflow-y:auto;padding:20px}
.pnl.active{display:flex}
.gtitle{font-size:72px;font-weight:bold;background:linear-gradient(#7bc67e,#3a8c3d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:8px;margin-bottom:5px}
.gsub{font-size:22px;color:#8bc34a;margin-bottom:35px}
.mbtn{padding:12px 28px;font-size:17px;font-weight:bold;background:linear-gradient(#4caf50,#2e7d32);color:#fff;border:2px solid #66bb6a;border-radius:8px;cursor:pointer;margin:4px;min-width:220px}
.mbtn:hover{background:linear-gradient(#66bb6a,#388e3c)}
.mbtn.sec{background:linear-gradient(#555,#333);border-color:#777}
.startbtn{font-size:22px;padding:14px 40px;background:linear-gradient(#ff9800,#e65100);border-color:#ffb74d;margin-top:20px}
.chgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:750px;margin:10px 0}
.chcard{background:rgba(255,255,255,.08);border:2px solid rgba(76,175,80,.3);border-radius:10px;padding:18px;cursor:pointer}
.chcard:hover{background:rgba(76,175,80,.15);border-color:#4caf50}
.bug-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:900px;margin:10px 0}
.bcard{background:rgba(255,255,255,.08);border:2px solid rgba(76,175,80,.3);border-radius:10px;padding:14px;text-align:center}.bcard.lk{opacity:.35;border-color:#555}
.boss-list{display:flex;flex-direction:column;gap:8px;max-width:400px;margin:15px 0}
.boss-item{background:rgba(255,0,0,.1);border:1px solid rgba(255,0,0,.3);padding:10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
.boss-item.beaten{background:rgba(0,128,0,.2);text-decoration:line-through;opacity:.5}
.hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50}.hud.hidden{display:none}
.hbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:20px;background:rgba(0,0,0,.6);padding:6px 20px;border-radius:16px;font-size:18px;font-weight:bold}
.nec{color:#ffeb3b}.tmr{font-family:monospace}.ess{color:#ce93d8}
.bpanel{position:absolute;bottom:0;left:0;display:flex;gap:5px;flex-wrap:wrap;max-width:600px;background:rgba(0,0,0,.8);padding:8px;border-radius:10px 10px 0 0;pointer-events:auto}
.bbtn{width:50px;height:50px;background:rgba(255,255,255,.1);border:2px solid #4caf50;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;position:relative}
.bbtn:hover{background:rgba(76,175,80,.3)}.bbtn.dis{opacity:.35;cursor:not-allowed}
.bcost{position:absolute;bottom:1px;right:3px;font-size:9px;color:#ffeb3b}
.hright{position:absolute;top:8px;right:8px;display:flex;gap:6px;pointer-events:auto}
.hbtn{padding:5px 12px;background:rgba(0,0,0,.6);border:1px solid #555;border-radius:4px;color:#fff;cursor:pointer}
.htint{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:10px 20px;border-radius:8px;border:1px solid #4caf50;white-space:nowrap;font-size:15px}
.rstats{background:rgba(0,0,0,.5);padding:20px 35px;border-radius:12px;margin:15px 0;font-size:17px;line-height:2}
.ogroup{display:flex;flex-direction:column;gap:14px;margin:18px 0;font-size:17px}
.mbtns{display:flex;flex-direction:column;gap:10px}
.back-btn{margin-top:20px}
.desc-box{max-width:500px;margin:10px auto;font-size:14px;line-height:1.8;color:#ccc;text-align:center}
.sbtn{font-size:14px;padding:8px 16px;background:rgba(76,175,80,.5);border:1px solid #4caf50;border-radius:6px;cursor:pointer;margin:3px}
.sbtn:hover{background:rgba(76,175,80,.8)}
</style></head><body>
<div id=gc><canvas id=cvs></canvas><div class=pnl active id=main-menu><div class=gtitle>BugBits</div><div class=gsub>Insect Strategy Game</div><div class=mbtns><button class=mbtn data-screen=story>Select Story</button><button class=mbtn data-screen=bossrush>Boss Rush</button><button class=mbtn data-screen=sandbox>Sandbox</button><button class=mbtn data-screen=timeatk>Time Attack</button><button class=mbtn data-screen=collection>Insectary</button><button class=mbtn data-screen=options>Options</button></div></div><div class=pnl id=story-select><h2 style=color:#8bc34a;margin-bottom:15px>Select Campaign</h2><div class=chgrid id=chapter-grid></div><button class=mbtn sec back-btn data-screen=main-menu>Back</button></div>
<div class=pnl id=briefing><h2 id=br-title style=color:#8bc34a></h2><div class=desc-box id=br-desc></div><div class=briefing-bugs id=br-bugs></div><button class=mbtn startbtn id=start-mission>Start Mission</button><button class=mbtn sec back-btn data-screen=story-select>Back</button></div>
<div class=hud hidden id=hud><div class=hbar><span class=nec id=nectar-disp>N: 0 / 60</span><span class=tmr id=timer>00:00</span><span class=ess id=essence-disp>X 0</span></div><div class=bpanel id=bug-panel></div><div class=hright><button class=hbtn id=sp-btn>Pause</button><button class=hbtn id=spd-btn>x1</button></div><div class=htint hidden id=hint-pop><span id=hint-text></span></div></div>
<div class=pnl id=results><h2 id=res-title style=color:#8bc34a;font-size:48px></h2><div class=rstats id=res-stats></div><div class=mbtns><button class=mbtn startbtn id=next-lvl>Next</button><button class=mbtn sec data-screen=story-select>Missions</button></div></div>
<div class=pnl id=pause-pnl><h2 style=color:#8bc34a;font-size:36px>PAUSED</h2><div class=mbtns><button class=mbtn id=resume-btn>Resume</button><button class=mbtn id=restart-btn>Restart</button><button class=mbtn sec id=abort-btn>Abort</button></div></div><div class=pnl id=collection><h2 style=color:#8bc34a;margin-bottom:15px>Insectary</h2><div class=bug-gallery id=bug-gallery></div><button class=mbtn sec back-btn data-screen=main-menu>Back</button></div>
<div class=pnl id=bossrush><h2 style=color:#ff5722;margin-bottom:10px>Boss Rush</h2><p style=color:#aaa;margin-bottom:10px>Defeat all 10 bosses in order!</p><div class=boss-list id=boss-list></div><button class=mbtn sec back-btn data-screen=main-menu>Back</button></div>
<div class=pnl id=sandbox><h2 style=color:#8bc34a;margin-bottom:15px>Sandbox Mode</h2><div class=ogroup><label>Start Nectar: <input type=number id=sb-nectar value=100 min=0 max=999 style=width:80px></label></div><button class=mbtn startbtn id=sb-start>Start Sandbox</button><button class=mbtn sec back-btn data-screen=main-menu>Back</button></div>
<div class=pnl id=timeatk><h2 style=color:#ff5722;margin-bottom:15px>Time Attack</h2><p style=color:#aaa;margin-bottom:20px;max-width:400px;text-align:center>Survive 10 minutes against waves of enemies!</p><button class=mbtn startbtn id=tatk-start>Start Time Attack</button><button class=mbtn sec back-btn data-screen=main-menu>Back</button></div>
<div class=pnl id=options><h2 style=color:#8bc34a;margin-bottom:20px>Options</h2><div class=ogroup><label>Show FPS: <input type=checkbox id=opt-fps></label></div><button class=mbtn sec back-btn data-screen=main-menu>Back</button></div>
</div><script src=game.js></script><script src=game_monetize.js></script></body></html>
